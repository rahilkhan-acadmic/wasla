name: Deploy

# Only runs on pushes to main, and only THIS branch can assume the AWS role
# (enforced by github-oidc-stack.json's trust policy) -- PRs and other
# branches never get AWS credentials, by design.
on:
  push:
    branches: ["main"]
  workflow_dispatch: {}  # lets you trigger a deploy manually from the Actions tab

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: distress-model-api

permissions:
  id-token: write   # required to request the OIDC token from GitHub
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials via OIDC (no stored access keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS account ID
        id: account
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Ensure S3/DynamoDB registry infrastructure exists (idempotent)
        run: |
          aws cloudformation deploy \
            --template-file aws/infrastructure.json \
            --stack-name distress-model-stack \
            --region ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists (idempotent)
        run: |
          aws cloudformation deploy \
            --template-file aws/ecr-stack.json \
            --stack-name distress-model-ecr \
            --region ${{ env.AWS_REGION }}

      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin \
            ${{ steps.account.outputs.id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Build image (Lambda-compatible manifest format)
        run: |
          docker build --platform linux/amd64 --provenance=false \
            -f Dockerfile.lambda -t ${{ env.ECR_REPOSITORY }} .

      - name: Tag and push image (tagged with the commit SHA -- always traceable)
        id: image
        run: |
          IMAGE_URI="${{ steps.account.outputs.id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          docker tag ${{ env.ECR_REPOSITORY }}:latest "$IMAGE_URI"
          docker push "$IMAGE_URI"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Deploy inference Lambda stack
        run: |
          aws cloudformation deploy \
            --template-file aws/lambda-stack.json \
            --stack-name distress-model-lambda \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides ImageUri=${{ steps.image.outputs.uri }}

      - name: Deploy automated retrain pipeline stack
        run: |
          aws cloudformation deploy \
            --template-file aws/automation-stack.json \
            --stack-name distress-model-automation \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides ImageUri=${{ steps.image.outputs.uri }}

      - name: Deploy dashboard hosting stack (S3 + CloudFront, idempotent)
        run: |
          aws cloudformation deploy \
            --template-file aws/dashboard-stack.json \
            --stack-name distress-model-dashboard \
            --region ${{ env.AWS_REGION }}

      - name: Get dashboard stack outputs
        id: dashboard
        run: |
          OUTPUTS=$(aws cloudformation describe-stacks --stack-name distress-model-dashboard \
            --region ${{ env.AWS_REGION }} --query "Stacks[0].Outputs" --output json)
          echo "bucket=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="DashboardBucketName") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="DistributionId") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "domain=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="DistributionDomainName") | .OutputValue')" >> "$GITHUB_OUTPUT"

      - name: Re-deploy inference Lambda stack with CORS now that the dashboard domain is known
        run: |
          aws cloudformation deploy \
            --template-file aws/lambda-stack.json \
            --stack-name distress-model-lambda \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides ImageUri=${{ steps.image.outputs.uri }} DashboardOrigin=${{ steps.dashboard.outputs.domain }}

      - name: Get inference Lambda Function URL
        id: function_url
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name distress-model-lambda \
            --region ${{ env.AWS_REGION }} --query "Stacks[0].Outputs[?OutputKey=='FunctionUrl'].OutputValue" --output text)
          echo "url=${URL%/}" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard (static export, pointed at the real API)
        working-directory: dashboard
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ steps.function_url.outputs.url }}
        run: |
          npm ci
          npm run build

      - name: Sync dashboard build to S3
        run: aws s3 sync dashboard/out/ s3://${{ steps.dashboard.outputs.bucket }}/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.dashboard.outputs.distribution_id }} \
            --paths "/*"

      - name: Summary
        run: |
          echo "### Deployed successfully :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ${{ steps.image.outputs.uri }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Dashboard: https://${{ steps.dashboard.outputs.domain }}" >> "$GITHUB_STEP_SUMMARY"
