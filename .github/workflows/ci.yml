name: CI

# Runs on every push and pull request, from any branch or fork. Deliberately
# needs NO AWS credentials -- everything here runs against local test
# fixtures and moto-mocked AWS, exactly as it does when run manually. This
# is what lets it safely run on PRs from forks, unlike the deploy workflow.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install cfn-lint

      - name: Compile-check all Python modules
        run: |
          python -m py_compile src/*.py data/*.py data/sources/*.py tests/*.py

      - name: Run retrain handler test suite (moto-mocked S3/DynamoDB)
        run: python tests/test_retrain_handler.py

      - name: Run EDGAR leakage-prevention tests
        run: python tests/test_edgar_leakage_prevention.py

      - name: Validate all CloudFormation templates
        run: |
          cfn-lint aws/infrastructure.json aws/ecr-stack.json aws/lambda-stack.json \
                   aws/automation-stack.json aws/github-oidc-stack.json

      - name: Validate all AWS JSON files are well-formed
        run: |
          for f in aws/*.json; do
            python -c "import json; json.load(open('$f'))" || exit 1
          done

      - name: Smoke-test the FastAPI app (in-process, no server needed)
        working-directory: src
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from app import app
          client = TestClient(app)
          r = client.post('/predict/demo/SYN027')
          assert r.status_code == 200, f'Expected 200, got {r.status_code}'
          assert 'probability_distressed' in r.json()
          print('FastAPI smoke test passed:', r.json())
          "
